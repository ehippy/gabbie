<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gabbie</title>
<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet"
/>
<style>
  #dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background-color: var(--bs-secondary);
    display: inline-block;
    transition: background-color 0.2s ease;
  }
  .dot-listening, .dot-transcribing { background-color: var(--bs-success) !important; }
  .dot-thinking { background-color: var(--bs-warning) !important; }
  .dot-speaking { background-color: var(--bs-primary) !important; }
  .dot-sleeping { background-color: #8850c8 !important; }
  .scroll-panel { max-height: 65vh; overflow-y: auto; }
  .msg .role.user { color: var(--bs-info); }
  .msg .role.assistant { color: var(--bs-success); }
</style>
</head>
<body>

<nav class="navbar navbar-expand bg-body-tertiary border-bottom mb-4">
  <div class="container-fluid">
    <span class="navbar-brand d-flex align-items-center gap-2 mb-0">
      <span id="dot"></span> Gabbie
    </span>
    <span id="state" class="text-secondary text-capitalize small">disconnected</span>
    <span id="mood" class="ms-2" style="font-size: 1.1rem; cursor: default;"></span>
  </div>
</nav>

<div class="container-fluid">
  <ul class="nav nav-tabs mb-4" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#pane-conversation" type="button">Conversation</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" data-bs-toggle="tab" data-bs-target="#pane-memory" type="button">Memory</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" data-bs-toggle="tab" data-bs-target="#pane-transcripts" type="button">Transcripts</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" data-bs-toggle="tab" data-bs-target="#pane-settings" type="button">Settings</button>
    </li>
  </ul>

  <div class="tab-content">
    <div class="tab-pane fade show active" id="pane-conversation" role="tabpanel">
      <div class="row g-4">
        <div class="col-lg-7">
          <div class="card">
            <div class="card-header">Live</div>
            <div class="card-body">
              <div id="live-conversation" class="scroll-panel">
                <p class="text-secondary small mb-0">Nothing yet - say the wake word to start.</p>
              </div>
            </div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="card">
            <div class="card-header">Web Activity</div>
            <div class="card-body">
              <div id="web-activity" class="scroll-panel">
                <p class="text-secondary small mb-0">Nothing yet - ask Gabbie to search or fetch something.</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="tab-pane fade" id="pane-memory" role="tabpanel">
      <div class="card">
        <div class="card-body">
          <div id="memory-list" class="list-group list-group-flush scroll-panel">
            <p class="text-secondary small mb-0">Loading...</p>
          </div>
        </div>
      </div>
    </div>

    <div class="tab-pane fade" id="pane-transcripts" role="tabpanel">
      <div class="card">
        <div class="card-body">
          <div class="row">
            <div class="col-4 border-end">
              <div id="transcript-list" class="list-group list-group-flush scroll-panel">
                <p class="text-secondary small mb-0">Loading...</p>
              </div>
            </div>
            <div class="col-8">
              <div id="transcript-view" class="scroll-panel">
                <p class="text-secondary small mb-0">Pick a session to view it.</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="tab-pane fade" id="pane-settings" role="tabpanel">
      <div class="card" style="max-width: 32rem;">
        <div class="card-header">LLM Model</div>
        <div class="card-body">
          <label for="model-select" class="form-label small text-secondary">
            Used for replies and background memory extraction. Takes effect on
            the next request - no restart needed.
          </label>
          <select id="model-select" class="form-select" disabled>
            <option>Loading...</option>
          </select>
          <div id="model-save-status" class="small text-secondary mt-2"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="lightbox" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content bg-black">
      <div class="modal-header border-0 py-2">
        <a id="lightbox-source" href="#" target="_blank" rel="noopener noreferrer"
           class="small text-secondary text-truncate"></a>
        <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body d-flex align-items-center justify-content-center position-relative p-0 pb-3">
        <button id="lightbox-prev" type="button"
                class="btn btn-outline-light rounded-circle position-absolute start-0 ms-2">&lsaquo;</button>
        <img id="lightbox-img" style="max-width: 100%; max-height: 75vh; object-fit: contain;" />
        <button id="lightbox-next" type="button"
                class="btn btn-outline-light rounded-circle position-absolute end-0 me-2">&rsaquo;</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function setStatus(state) {
  document.getElementById("state").textContent = state;
  const dot = document.getElementById("dot");
  dot.className = "";
  dot.classList.add("dot-" + state);
}

// --- Live status ---
function connectStream() {
  const es = new EventSource("/api/status/stream");
  setStatus("connected");
  es.onmessage = (e) => {
    const evt = JSON.parse(e.data);
    switch (evt.event) {
      case "listening":
      case "transcribing":
      case "thinking":
      case "sleeping":
        setStatus(evt.event);
        break;
      case "heard":
        if (!evt.ignored) appendConversationLine("user", evt.text);
        break;
      case "speaking":
        setStatus("speaking");
        appendConversationLine("assistant", evt.text);
        break;
      case "done_speaking":
        setStatus("listening");
        break;
      case "bye":
        setStatus("idle");
        break;
      case "remembered":
      case "forgot":
        loadMemory();
        break;
      case "tool_call":
        renderToolCall(evt);
        break;
      case "mood":
        setMood(evt.value, evt.label);
        break;
    }
  };
  es.onerror = () => {
    setStatus("disconnected");
    es.close();
    setTimeout(connectStream, 2000);
  };
}

// --- Conversation ---
function appendConversationLine(role, text) {
  const el = document.getElementById("live-conversation");
  const placeholder = el.querySelector(".text-secondary.small");
  if (placeholder) el.innerHTML = "";
  const div = document.createElement("div");
  div.className = "msg mb-2";
  const roleClass = role === "user" ? "user" : "assistant";
  const roleLabel = role === "user" ? "You" : "Gabbie";
  div.innerHTML = `
    <span class="role ${roleClass} fw-semibold small">${roleLabel}</span>
    <span class="text-secondary" style="font-size: 0.75rem;">${new Date().toLocaleTimeString()}</span>
    <div>${escapeHtml(text)}</div>`;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

// --- Mood ---
function setMood(value, label) {
  const el = document.getElementById("mood");
  const emoji = value >= 3 ? "😄" : value >= 1 ? "🙂" : value <= -3 ? "😔" : value <= -1 ? "😕" : "😐";
  el.textContent = emoji;
  el.title = label ? `Mood: ${label} (${value})` : `Mood: neutral (${value})`;
}

async function loadMood() {
  const data = await fetch("/api/mood").then((r) => r.json());
  setMood(data.value, data.label);
}

// --- Settings ---
async function loadSettings() {
  const select = document.getElementById("model-select");
  const [models, settings] = await Promise.all([
    fetch("/api/models").then((r) => r.json()),
    fetch("/api/settings").then((r) => r.json()),
  ]);
  select.innerHTML = "";
  if (!models.length) {
    select.innerHTML = '<option value="">No models available - is neuralforge running?</option>';
    select.disabled = true;
    return;
  }
  for (const m of models) {
    const opt = document.createElement("option");
    opt.value = m.id;
    const size = m.size_gb ? `${m.size_gb} GB` : "";
    const ctx = m.context_length ? `${Math.round(m.context_length / 1000)}k ctx` : "";
    const detail = [size, ctx].filter(Boolean).join(", ");
    opt.textContent = detail ? `${m.id} — ${detail}` : m.id;
    select.appendChild(opt);
  }
  select.value = settings.llm_model;
  // The saved model might not be in the downloaded+tool-calling list
  // (renamed, removed, or picked before this filter existed) - show it
  // anyway rather than silently switching to something the user didn't
  // choose.
  if (select.value !== settings.llm_model) {
    const opt = document.createElement("option");
    opt.value = settings.llm_model;
    opt.textContent = `${settings.llm_model} (not currently available)`;
    select.insertBefore(opt, select.firstChild);
    select.value = settings.llm_model;
  }
  select.disabled = false;
  select.onchange = saveModel;
}

async function saveModel() {
  const select = document.getElementById("model-select");
  const status = document.getElementById("model-save-status");
  status.textContent = "Saving...";
  const res = await fetch("/api/settings", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ llm_model: select.value }),
  });
  status.textContent = res.ok ? "Saved - takes effect on the next reply." : "Failed to save.";
  setTimeout(() => { status.textContent = ""; }, 4000);
}

// --- Memory ---
async function loadMemory() {
  const facts = await fetch("/api/memory").then((r) => r.json());
  const el = document.getElementById("memory-list");
  if (!facts.length) {
    el.innerHTML = '<p class="text-secondary small mb-0">Nothing remembered yet.</p>';
    return;
  }
  el.innerHTML = "";
  for (const f of facts) {
    const row = document.createElement("div");
    row.className = "list-group-item d-flex justify-content-between align-items-start gap-2";
    row.innerHTML = `
      <div>
        <div>${escapeHtml(f.fact)}</div>
        <div class="text-secondary" style="font-size: 0.75rem;">${f.ts || ""}</div>
      </div>`;
    const btn = document.createElement("button");
    btn.className = "btn btn-sm btn-outline-danger flex-shrink-0";
    btn.textContent = "forget";
    btn.onclick = async () => {
      await fetch("/api/memory/" + encodeURIComponent(f.ts), { method: "DELETE" });
      loadMemory();
    };
    row.appendChild(btn);
    el.appendChild(row);
  }
}

// --- Transcripts ---
async function loadTranscriptList() {
  const names = await fetch("/api/transcripts").then((r) => r.json());
  const el = document.getElementById("transcript-list");
  if (!names.length) {
    el.innerHTML = '<p class="text-secondary small mb-0">No sessions yet.</p>';
    return;
  }
  el.innerHTML = "";
  for (const name of names) {
    const item = document.createElement("button");
    item.type = "button";
    item.className = "list-group-item list-group-item-action small";
    item.textContent = name.replace(".jsonl", "").replace("T", " ");
    item.onclick = () => selectTranscript(name, item);
    el.appendChild(item);
  }
}

async function selectTranscript(name, itemEl) {
  document.querySelectorAll("#transcript-list .list-group-item").forEach((el) => el.classList.remove("active"));
  itemEl.classList.add("active");
  const entries = await fetch("/api/transcripts/" + encodeURIComponent(name)).then((r) => r.json());
  const view = document.getElementById("transcript-view");
  view.innerHTML = "";
  for (const entry of entries) {
    const div = document.createElement("div");
    div.className = "msg mb-2";
    const roleClass = entry.role === "user" ? "user" : "assistant";
    const roleLabel = entry.role === "user" ? "You" : "Gabbie";
    div.innerHTML = `
      <span class="role ${roleClass} fw-semibold small">${roleLabel}</span>
      <span class="text-secondary" style="font-size: 0.75rem;">${entry.ts || ""}</span>
      <div>${escapeHtml(entry.content)}</div>`;
    view.appendChild(div);
  }
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

// Only allow http(s) links, and let the URL parser normalize/encode them -
// this is result data from a search API / fetched page, so it's untrusted.
function safeUrl(url) {
  try {
    const u = new URL(url);
    if (u.protocol === "http:" || u.protocol === "https:") return u.href;
  } catch (e) {
    /* fall through */
  }
  return "#";
}

// --- Web Activity ---
function renderToolCall(evt) {
  const el = document.getElementById("web-activity");
  // other tools aren't screen-shaped
  if (!["web_search", "image_search", "view_image", "fetch_url"].includes(evt.name)) return;
  const placeholder = el.querySelector(".text-secondary.small");
  if (placeholder) el.innerHTML = "";

  const card = document.createElement("div");
  card.className = "border-bottom pb-2 mb-2";

  if (evt.name === "web_search" && evt.extra) {
    let html = `<div class="fw-semibold mb-1">🔎 "${escapeHtml(evt.extra.query)}"</div>`;
    for (const r of evt.extra.results || []) {
      html += `
        <div class="mb-2">
          <a href="${safeUrl(r.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(r.title)}</a>
          <div class="text-secondary small">${escapeHtml(r.description)}</div>
        </div>`;
    }
    card.innerHTML = html;
  } else if (evt.name === "image_search" && evt.extra) {
    const results = evt.extra.results || [];
    const groupId = imageGroups.push(results) - 1;
    let html = `<div class="fw-semibold mb-1">🖼️ "${escapeHtml(evt.extra.query)}"</div><div class="d-flex flex-wrap gap-2">`;
    results.forEach((r, i) => {
      html += `
        <img src="${safeUrl(r.thumbnail)}" alt="${escapeHtml(r.title)}" title="${escapeHtml(r.title)}"
             class="lightbox-thumb" data-group="${groupId}" data-index="${i}"
             style="width:100px;height:100px;object-fit:cover;border-radius:0.375rem;cursor:pointer;" />`;
    });
    html += `</div>`;
    card.innerHTML = html;
    card.querySelectorAll(".lightbox-thumb").forEach((img) => {
      img.onclick = () => openLightbox(Number(img.dataset.group), Number(img.dataset.index));
    });
  } else if (evt.name === "view_image" && evt.extra) {
    card.innerHTML = `
      <div class="fw-semibold mb-1">👀 Image #${evt.extra.index}</div>
      <div class="d-flex gap-2 align-items-start">
        <img src="${safeUrl(evt.extra.thumbnail)}" alt="${escapeHtml(evt.extra.title)}"
             style="width:80px;height:80px;object-fit:cover;border-radius:0.375rem;flex-shrink:0;" />
        <div class="small">${escapeHtml(evt.result)}</div>
      </div>`;
  } else if (evt.name === "fetch_url" && evt.extra) {
    card.innerHTML = `
      <div class="fw-semibold mb-1">🌐 Fetched</div>
      <a href="${safeUrl(evt.extra.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(evt.extra.url)}</a>`;
  } else {
    return; // an error result with no structured data - nothing to show visually
  }

  el.insertBefore(card, el.firstChild);
  while (el.children.length > 20) el.removeChild(el.lastChild);
}

// --- Image lightbox ---
// Each image_search result set is kept here by index (referenced from its
// thumbnails' data-group attribute) so prev/next can walk it without
// re-fetching or re-parsing the DOM.
const imageGroups = [];
let lightboxGroup = 0;
let lightboxIndex = 0;
const lightboxEl = document.getElementById("lightbox");
const lightboxModal = new bootstrap.Modal(lightboxEl);

function showLightboxImage() {
  const r = imageGroups[lightboxGroup][lightboxIndex];
  const img = document.getElementById("lightbox-img");
  // Prefer the full-resolution source image; if it's missing or the host
  // blocks hotlinking, fall back to Brave's own thumbnail proxy so the
  // lightbox never shows a broken image.
  img.src = safeUrl(r.image_url) !== "#" ? safeUrl(r.image_url) : safeUrl(r.thumbnail);
  img.onerror = () => {
    img.onerror = null;
    img.src = safeUrl(r.thumbnail);
  };
  const source = document.getElementById("lightbox-source");
  source.href = safeUrl(r.source_url);
  source.textContent = r.title || r.source_url || "";
}

function openLightbox(groupId, index) {
  lightboxGroup = groupId;
  lightboxIndex = index;
  showLightboxImage();
  lightboxModal.show();
}

function stepLightbox(delta) {
  const group = imageGroups[lightboxGroup];
  lightboxIndex = (lightboxIndex + delta + group.length) % group.length;
  showLightboxImage();
}

document.getElementById("lightbox-prev").onclick = () => stepLightbox(-1);
document.getElementById("lightbox-next").onclick = () => stepLightbox(1);
lightboxEl.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") stepLightbox(-1);
  else if (e.key === "ArrowRight") stepLightbox(1);
});

connectStream();
loadMemory();
loadMood();
loadTranscriptList();
loadSettings();
</script>

</body>
</html>
