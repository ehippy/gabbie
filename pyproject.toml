[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "gabbie"
version = "0.2.0"
description = "Voice gateway for Raspberry Pi 3"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kittentts>=0.1.3",
    "openwakeword>=0.4.0",
    "websockets>=12.0",
    "pyaudio>=0.2.14",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "textual>=0.80.0",
    "toml>=0.10.2",
    "typer>=0.12.0",
    "tomli>=2.4.1",
    "tomli-w>=1.2.0",
]

[project.scripts]
gabbie = "src.cli:app"
gabbie-daemon = "src.daemon:main"
gabbie-tui = "src.tui.app:main"
